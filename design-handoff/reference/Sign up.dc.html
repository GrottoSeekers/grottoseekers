<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #faf6ee; color: #2c1a0e; font-family: "Montserrat", sans-serif; min-height: 100vh; }
  * { box-sizing: border-box; }
  a { color: #2f5d45; }
  a:hover { color: #2c1a0e; }
  input::placeholder { color: rgba(44,26,14,.35); }
  @keyframes gs-ring { to { transform: rotate(360deg); } }
  @keyframes gs-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  @media (max-width: 700px) {
    [data-auth-nav] { padding: 14px 24px !important; }
    [data-auth-card] { padding: 34px 26px !important; }
  }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#faf6ee">

  <div data-loader="1" aria-hidden="true" style="position:fixed;inset:0;z-index:9999;background:rgba(250,246,238,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease">
    <div style="position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center">
      <div style="position:absolute;inset:0;border-radius:50%;border:3px solid rgba(110,84,56,.18)"></div>
      <div style="position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#2f5d45;border-right-color:rgba(110,84,56,.45);animation:gs-ring 1s linear infinite"></div>
      <img src="public/images/logo-mark.png" alt="" style="width:74px;height:74px;object-fit:contain;animation:gs-pulse 1.8s ease-in-out infinite" />
    </div>
  </div>


  <nav data-auth-nav="1" data-screen-label="Header" style="padding:16px 48px;border-bottom:1px solid rgba(110,84,56,.2);background:#faf6ee">
    <a href="Home.dc.html" style="display:inline-flex;align-items:center;gap:14px;text-decoration:none;line-height:1;margin-left:-4px;font-family:'Montserrat',sans-serif;font-weight:500;font-size:1.4rem;letter-spacing:.28em">
      <img src="public/images/logo-mark.png" alt="" style="height:46px;width:46px;display:block;object-fit:contain" />
      <span style="display:flex;flex-direction:column;gap:5px;padding-left:14px;border-left:1px solid rgba(110,84,56,.4)"><span style="color:#2f5d45;line-height:1">MYAH</span><span style="font-family:'Lato',sans-serif;font-weight:700;font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:#8a6a4f;line-height:1">Make Yourself At Home</span></span>
    </a>
  </nav>

  <main data-screen-label="Sign up" style="flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px">
    <div data-auth-card="1" style="background:#fff;border:1px solid rgba(110,84,56,.2);border-radius:20px;padding:48px;width:100%;max-width:460px;box-shadow:0 4px 32px rgba(44,26,14,.08)">
      <p style="font-size:.75rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#6e5438;margin:0 0 14px;display:flex;align-items:center;gap:12px"><span style="width:26px;height:1px;background:#6e5438;display:block;flex-shrink:0"></span>MYAH</p>
      <h1 style="font-family:'Marcellus',serif;font-size:2.2rem;color:#2c1a0e;line-height:1.2;margin:0">Create your account</h1>
      <div style="width:48px;height:2px;background:#6e5438;margin:20px 0 24px"></div>
      <p style="font-size:.98rem;color:#6b4e35;line-height:1.7;margin:0 0 28px">Join MYAH — whether you're offering house &amp; pet sitting services or looking for a trusted sitter.</p>

      <form data-signup-form="1" data-go="Create profile.dc.html" style="display:flex;flex-direction:column;gap:22px">
        <div>
          <p style="font-size:.78rem;font-weight:600;letter-spacing:.1em;color:#5c3d20;text-transform:uppercase;margin:0 0 12px">I am a…</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div data-role="sitter" data-role-card="1" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px;border:2px solid #2f5d45;background:rgba(110,84,56,.07);border-radius:14px;text-align:center;cursor:pointer;transition:border-color .2s, background .2s">
              <span style="width:42px;height:42px;border-radius:12px;background:#faf6ee;border:1px solid rgba(110,84,56,.28);color:#6e5438;display:flex;align-items:center;justify-content:center;margin-bottom:2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
              <span style="font-family:'Marcellus',serif;font-size:1.05rem;color:#2c1a0e">Pet Sitter</span>
              <span style="font-size:.76rem;color:#6b4e35;line-height:1.4">I look after pets &amp; homes</span>
            </div>
            <div data-role="owner" data-role-card="1" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px;border:2px solid rgba(44,26,14,.12);background:#fff;border-radius:14px;text-align:center;cursor:pointer;transition:border-color .2s, background .2s">
              <span style="width:42px;height:42px;border-radius:12px;background:#faf6ee;border:1px solid rgba(110,84,56,.28);color:#6e5438;display:flex;align-items:center;justify-content:center;margin-bottom:2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
              <span style="font-family:'Marcellus',serif;font-size:1.05rem;color:#2c1a0e">Pet Owner</span>
              <span style="font-size:.76rem;color:#6b4e35;line-height:1.4">I need a trusted sitter</span>
            </div>
          </div>
        </div>

        <label style="display:flex;flex-direction:column;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.1em;color:#5c3d20;text-transform:uppercase">
          Email address
          <input type="email" name="email" required="required" autocomplete="email" placeholder="you@example.com" style="border:1.5px solid rgba(44,26,14,.2);border-radius:10px;padding:13px 15px;font-size:1rem;font-family:'Montserrat',sans-serif;font-weight:400;letter-spacing:0;text-transform:none;color:#2c1a0e;background:#faf6ee;outline:none;transition:border-color .2s, box-shadow .2s" style-focus="border-color:#2f5d45;box-shadow:0 0 0 3px rgba(110,84,56,.15)" />
        </label>

        <label style="display:flex;flex-direction:column;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.1em;color:#5c3d20;text-transform:uppercase">
          Password
          <span style="position:relative;display:block">
            <input type="password" data-pw="1" name="password" required="required" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" style="width:100%;padding:13px 74px 13px 15px;border:1.5px solid rgba(44,26,14,.2);border-radius:10px;font-size:1rem;font-family:'Montserrat',sans-serif;font-weight:400;letter-spacing:0;text-transform:none;color:#2c1a0e;background:#faf6ee;outline:none;transition:border-color .2s, box-shadow .2s" style-focus="border-color:#2f5d45;box-shadow:0 0 0 3px rgba(110,84,56,.15)" />
            <button type="button" data-pw-toggle="1" aria-label="Show password" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#2f5d45;font-size:.74rem;font-weight:600;letter-spacing:.08em;cursor:pointer;padding:4px 8px;text-transform:uppercase;font-family:'Montserrat',sans-serif;transition:color .2s" style-hover="color:#2c1a0e">Show</button>
          </span>
        </label>

        <label style="display:flex;flex-direction:column;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.1em;color:#5c3d20;text-transform:uppercase">
          Confirm password
          <span style="position:relative;display:block">
            <input type="password" data-pw="1" name="confirm" required="required" autocomplete="new-password" minlength="8" placeholder="Repeat your password" style="width:100%;padding:13px 74px 13px 15px;border:1.5px solid rgba(44,26,14,.2);border-radius:10px;font-size:1rem;font-family:'Montserrat',sans-serif;font-weight:400;letter-spacing:0;text-transform:none;color:#2c1a0e;background:#faf6ee;outline:none;transition:border-color .2s, box-shadow .2s" style-focus="border-color:#2f5d45;box-shadow:0 0 0 3px rgba(110,84,56,.15)" />
            <button type="button" data-pw-toggle="1" aria-label="Show password" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#2f5d45;font-size:.74rem;font-weight:600;letter-spacing:.08em;cursor:pointer;padding:4px 8px;text-transform:uppercase;font-family:'Montserrat',sans-serif;transition:color .2s" style-hover="color:#2c1a0e">Show</button>
          </span>
        </label>

        <button type="submit" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:4px;font-size:.76rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#2f5d45;border:1.5px solid #2f5d45;border-radius:50px;padding:13px 32px;cursor:pointer;font-family:'Montserrat',sans-serif;white-space:nowrap;box-shadow:0 6px 20px rgba(110,84,56,.28);transition:background .2s, border-color .2s, transform .12s" style-hover="background:#3e7a5b;border-color:#3e7a5b;transform:translateY(-2px);box-shadow:0 12px 28px rgba(110,84,56,.36)" style-active="transform:translateY(0) scale(.98)">Create account</button>
      </form>

      <p style="margin:26px 0 0;text-align:center;font-size:.92rem;color:#6b4e35">Already have an account? <a href="Log in.dc.html" style="color:#2f5d45;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(110,84,56,.4);padding-bottom:1px">Log in</a></p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:820}}">
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this.hideT); }
  componentDidMount() {
    document.querySelectorAll('form[data-go]').forEach(f => f.addEventListener('submit', e => {
      e.preventDefault(); e.stopImmediatePropagation();
      const target = f.getAttribute('data-go');
      const l = document.querySelector('[data-loader]');
      if (l) { l.style.opacity = '1'; l.style.pointerEvents = 'all'; }
      setTimeout(() => { window.location.href = target; }, l ? 700 : 150);
    }, true));
    document.querySelectorAll('[data-pw-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('[data-pw]');
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.textContent = showing ? 'Show' : 'Hide';
      });
    });
    const cards = document.querySelectorAll('[data-role-card]');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          const on = c === card;
          c.style.borderColor = on ? '#2f5d45' : 'rgba(44,26,14,.12)';
          c.style.background = on ? 'rgba(110,84,56,.07)' : '#fff';
        });
        const form = document.querySelector('[data-signup-form]');
        if (form) form.setAttribute('data-go', card.getAttribute('data-role') === 'owner' ? 'Create owner profile.dc.html' : 'Create profile.dc.html');
      });
    });
    const loader = document.querySelector('[data-loader]');
    const showLoader = () => {
      if (!loader) return;
      loader.style.opacity = '1';
      loader.style.pointerEvents = 'all';
      clearTimeout(this.hideT);
      this.hideT = setTimeout(() => { loader.style.opacity = '0'; loader.style.pointerEvents = 'none'; }, 1600);
    };
    document.querySelectorAll('form').forEach(f => f.addEventListener('submit', e => { e.preventDefault(); showLoader(); }));
    document.querySelectorAll('a[href], button[type="submit"]').forEach(el => {
      const href = el.getAttribute('href') || '';
      if (href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto') || href.startsWith('tel') || el.target === '_blank') return;
      el.addEventListener('click', e => { if (e.metaKey || e.ctrlKey || e.shiftKey) return; showLoader(); });
    });
  }
}
</script>
</body>
</html>
